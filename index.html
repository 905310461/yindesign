<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>点单系统</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f6f6f6;
      }

      .header {
        background: #ff6b6b;
        color: white;
        padding: 15px;
        font-size: 20px;
        text-align: center;
      }

      .menu {
        padding: 10px;
      }

      .card {
        background: white;
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .card-name {
        font-size: 16px;
        font-weight: bold;
      }

      .card-price {
        color: #888;
      }

      button {
        background: #ff6b6b;
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 20px;
        font-size: 14px;
      }

      .cart-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: white;
        border-top: 1px solid #ddd;
        padding: 10px;
        display: flex;
        justify-content: space-between;
      }

      .cart-btn {
        background: #28a745;
      }

      .cart-popup {
        position: fixed;
        bottom: 60px;
        left: 10px;
        right: 10px;
        background: white;
        border-radius: 12px;
        padding: 10px;
        display: none;
        max-height: 300px;
        overflow: auto;
      }
    </style>
  </head>

  <body>
    <div class="header">🍱 点单系统</div>

    <div class="menu" id="menu"></div>

    <div class="cart-popup" id="cartPopup"></div>

    <div class="cart-bar">
      <div>总价：$<span id="total">0</span></div>
      <button class="cart-btn" onclick="toggleCart()">查看购物车</button>
      <button onclick="submitOrder()">下单</button>
    </div>

    <script>
      const menuData = [
        { name: '汉堡', price: 5 },
        { name: '薯条', price: 3 },
        { name: '可乐', price: 2 }
      ]

      let cart = []

      function renderMenu() {
        const menu = document.getElementById('menu')
        menu.innerHTML = ''

        menuData.forEach(item => {
          menu.innerHTML += `
      <div class="card">
        <div>
          <div class="card-name">${item.name}</div>
          <div class="card-price">$${item.price}</div>
        </div>
        <button onclick="addItem('${item.name}',${item.price})">+</button>
      </div>
    `
        })
      }

      function addItem(name, price) {
        const existing = cart.find(i => i.name === name)
        if (existing) {
          existing.qty++
        } else {
          cart.push({ name, price, qty: 1 })
        }
        renderCart()
      }

      function renderCart() {
        let total = 0
        const popup = document.getElementById('cartPopup')
        popup.innerHTML = ''

        cart.forEach(item => {
          total += item.price * item.qty

          popup.innerHTML += `
      <div style="display:flex;justify-content:space-between;margin:5px 0">
        ${item.name} x${item.qty}
        <button onclick="removeItem('${item.name}')">-</button>
      </div>
    `
        })

        document.getElementById('total').innerText = total
      }

      function removeItem(name) {
        cart = cart.filter(i => i.name !== name)
        renderCart()
      }

      function toggleCart() {
        const popup = document.getElementById('cartPopup')
        popup.style.display = popup.style.display === 'block' ? 'none' : 'block'
      }

      function submitOrder() {
        if (cart.length === 0) {
          alert('请先点单')
          return
        }
        alert('✅ 下单成功（UI版）')
        cart = []
        renderCart()
      }

      renderMenu()
    </script>
  </body>
</html>
