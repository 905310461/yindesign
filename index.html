<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的设计作品集</title>
    <!-- 引入 Macy.js 用于瀑布流 -->
    <script src="https://cdn.jsdelivr.net/npm/macy@2.5.1/dist/macy.min.js"></script>
    <style>
      :root {
        --bg-color: #f4f4f4;
        --card-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      body {
        font-family: 'PingFang SC', sans-serif;
        background: var(--bg-color);
        margin: 0;
        padding: 20px;
      }

      /* 导航栏 */
      header {
        text-align: center;
        padding: 40px 0;
      }
      h1 {
        font-weight: 300;
        letter-spacing: 2px;
      }

      /* 瀑布流容器 */
      #macy-container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
      }

      /* 作品卡片 */
      .work-item {
        background: #fff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: var(--card-shadow);
        transition: transform 0.3s ease;
        cursor: pointer;
        margin-bottom: 20px; /* 间距 */
      }
      .work-item:hover {
        transform: translateY(-5px);
      }
      .work-item img {
        width: 100%;
        display: block;
        height: auto;
      }

      .work-info {
        padding: 12px;
      }
      .work-info h3 {
        margin: 0;
        font-size: 14px;
        color: #333;
      }

      /* 响应式调整 */
      @media (max-width: 600px) {
        body {
          padding: 10px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>DESIGN PORTFOLIO</h1>
      <p>UI设计 / 平面 / H5</p>
    </header>

    <!-- 作品列表 -->
    <div id="macy-container">
      <!-- 模拟作品卡片，实际使用时建议通过 JS 循环生成 -->
      <div class="work-item">
        <img src="images/123.jpg" alt="作品" />
        <div class="work-info"><h3>新年充值展架</h3></div>
      </div>
      <div class="work-item">
        <img src="images/01.jpg" alt="作品" />
        <div class="work-info"><h3>充值活动展架</h3></div>
      </div>
      <div class="work-item">
        <img src="images/01.png" alt="作品" />
        <div class="work-info"><h3>8月充值活动</h3></div>
      </div>

      <div class="work-item">
        <img src="images/03.png" alt="作品" />
        <div class="work-info"><h3>积分商城小程序</h3></div>
      </div>

      <div class="work-item">
        <img src="images/05.jpg" alt="作品" />
        <div class="work-info"><h3>8月充值界面改版</h3></div>
      </div>
      <div class="work-item">
        <img src="images/1080.jpg" alt="作品" />
        <div class="work-info"><h3>8月充值活动展架</h3></div>
      </div>
      <div class="work-item">
        <img src="images/08.png" alt="作品" />
        <div class="work-info"><h3>保养活动海报</h3></div>
      </div>

      <div class="work-item">
        <img src="images/ym.jpg" alt="作品" />
        <div class="work-info"><h3>活动抽奖H5界面</h3></div>
      </div>
      <div class="work-item">
        <img src="images/resune2.jpg" alt="作品" />
        <div class="work-info"><h3>简历</h3></div>
      </div>
      <!-- 复制更多卡片... -->
    </div>

    <script>
      // 初始化瀑布流
      var macy = Macy({
        container: '#macy-container',
        trueOrder: false,
        waitForImages: true,
        margin: 20,
        columns: 4, // 默认 4 列
        breakAt: {
          1200: 4,
          940: 3,
          520: 2,
          400: 1
        }
      })

      // 跳转详情页逻辑（静态版演示）
      function showDetail(title, imgUrl) {
        // 实际开发中可以跳转到 detail.html?id=1
        alert('即将进入《' + title + '》的具体展示页面')
        // window.location.href = 'detail.html';
      }
    </script>
  </body>
</html>
